services:
  edcb_notify:
    build: .
    container_name: edcb-notify
    restart: always
    environment:
      - TZ=Asia/Tokyo
      - EDCB_RECINFO_FILE=/app/RecInfo.txt
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your_webhook_url
    volumes:
      - ./RecInfo.txt:/app/RecInfo.txt
